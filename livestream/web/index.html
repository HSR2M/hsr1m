<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DJI Mini 5 Pro 라이브</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #0b0d10; color: #e8eaed; font-family: system-ui, sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 1.1rem; font-weight: 600; margin: 0 0 12px; }
  .stage { position: relative; background: #000; aspect-ratio: 16 / 9; border-radius: 8px; overflow: hidden; }
  video { width: 100%; height: 100%; object-fit: contain; display: block; }
  .badge { position: absolute; top: 10px; left: 10px; padding: 4px 10px; border-radius: 999px;
           font-size: .8rem; background: rgba(0,0,0,.6); }
  .badge.live::before { content: "● "; color: #ff3b30; }
  .overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
             text-align: center; padding: 16px; color: #9aa0a6; }
  .overlay[hidden] { display: none; }
</style>
</head>
<body>
<main>
  <h1>DJI Mini 5 Pro 라이브</h1>
  <div class="stage">
    <video id="video" autoplay muted playsinline controls></video>
    <div id="badge" class="badge">대기 중</div>
    <div id="overlay" class="overlay">드론 송출을 기다리는 중입니다…</div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
<script>
const PATH = "live";                       // mediamtx.yml 의 경로 이름과 동일해야 함
const WHEP_URL = `/webrtc/${PATH}/whep`;
const HLS_URL  = `/hls/${PATH}/index.m3u8`;
const RETRY_MS = 3000;

const video = document.getElementById("video");
const badge = document.getElementById("badge");
const overlay = document.getElementById("overlay");

let pc = null, hls = null, retryTimer = null;

function setState(text, live) {
  badge.textContent = text;
  badge.classList.toggle("live", live);
  overlay.hidden = live;
}

function teardown() {
  if (pc) { pc.close(); pc = null; }
  if (hls) { hls.destroy(); hls = null; }
  video.srcObject = null;
  video.removeAttribute("src");
}

function scheduleRetry() {
  teardown();
  setState("대기 중", false);
  clearTimeout(retryTimer);
  retryTimer = setTimeout(start, RETRY_MS);
}

// ICE 후보 수집이 끝나길 잠시 기다린 뒤 완성된 SDP 를 보낸다.
function iceGatheringDone(conn, timeoutMs = 2000) {
  return new Promise(resolve => {
    if (conn.iceGatheringState === "complete") return resolve();
    const done = () => { conn.removeEventListener("icegatheringstatechange", onChange); resolve(); };
    const onChange = () => { if (conn.iceGatheringState === "complete") done(); };
    conn.addEventListener("icegatheringstatechange", onChange);
    setTimeout(done, timeoutMs);
  });
}

async function startWebRTC() {
  pc = new RTCPeerConnection({ iceServers: [{ urls: "stun:stun.l.google.com:19302" }] });
  pc.addTransceiver("video", { direction: "recvonly" });
  pc.addTransceiver("audio", { direction: "recvonly" });
  pc.ontrack = e => { video.srcObject = e.streams[0]; };
  pc.onconnectionstatechange = () => {
    if (pc && ["failed", "disconnected", "closed"].includes(pc.connectionState)) scheduleRetry();
  };

  await pc.setLocalDescription(await pc.createOffer());
  await iceGatheringDone(pc);

  const res = await fetch(WHEP_URL, {
    method: "POST",
    headers: { "Content-Type": "application/sdp" },
    body: pc.localDescription.sdp,
  });
  if (!res.ok) throw new Error(`WHEP ${res.status}`);
  await pc.setRemoteDescription({ type: "answer", sdp: await res.text() });
}

function startHLS() {
  return new Promise((resolve, reject) => {
    if (video.canPlayType("application/vnd.apple.mpegurl")) {   // Safari / iOS
      video.src = HLS_URL;
      video.addEventListener("loadedmetadata", resolve, { once: true });
      video.addEventListener("error", () => reject(new Error("HLS")), { once: true });
      return;
    }
    if (!window.Hls || !Hls.isSupported()) return reject(new Error("HLS unsupported"));
    hls = new Hls({ lowLatencyMode: true });
    hls.loadSource(HLS_URL);
    hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED, resolve);
    hls.on(Hls.Events.ERROR, (_, d) => { if (d.fatal) { reject(new Error(d.type)); } });
  });
}

async function start() {
  teardown();
  try {
    await startWebRTC();
    setState("LIVE (WebRTC)", true);
    return;
  } catch (e) {
    console.warn("WebRTC 실패, HLS 로 전환:", e);
    teardown();
  }
  try {
    await startHLS();
    setState("LIVE (HLS)", true);
    video.play().catch(() => {});
    if (hls) hls.on(Hls.Events.ERROR, (_, d) => { if (d.fatal) scheduleRetry(); });
  } catch (e) {
    console.warn("HLS 실패:", e);
    scheduleRetry();
  }
}

start();
</script>
</body>
</html>
